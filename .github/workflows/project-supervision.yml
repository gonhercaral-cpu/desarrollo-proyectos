name: Supervisión inteligente — web y Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/project-supervision.yml"
      - "functions/projectSupervision*.js"
      - "functions/operationalNotifications.js"
      - "src/utils/projectNotificationActivity.js"
      - "functions/deviceAccess.js"
      - "functions/index.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "src/components/ProjectSupervision.jsx"
      - "src/services/projectSupervisionService.js"
      - "src/pages/AllProjects.jsx"
      - "src/styles/app/modules/18-project-supervision.css"
      - "src/context/**"
      - "src/services/firebase*"
      - "tests/project-supervision-*.test.cjs"
      - "tests/firebase-rules.test.mjs"
      - "tests/operational-notifications-tools.test.cjs"
      - "tests/project-notification-activity.test.mjs"
      - "docs/supervision-*.md"
      - "docs/supervision-*.json"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - "firebase.rules-test.json"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "vite.config.js"

permissions:
  contents: read

concurrency:
  group: project-supervision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervision:
    name: Motor, Gemini simulado, web y reglas de Supervisión
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: "true"
      XDG_CONFIG_HOME: ${{ github.workspace }}/.firebase/cli-config
      PROJECT_SUPERVISION_AI_APPROVED: "false"
      PROJECT_SUPERVISION_AI_SCHEDULED_APPROVED: "false"
      PROJECT_SUPERVISION_AUTOMATION_APPROVED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Dependencias web, backend y emuladores
        run: |
          npm ci
          npm ci --prefix functions
          npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.27.0
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Lint específico y sintaxis de entrada Firebase
        run: |
          npx eslint --config eslint.config.js functions/index.js functions/projectSupervision*.js src/components/ProjectSupervision.jsx src/services/projectSupervisionService.js src/pages/AllProjects.jsx tests/project-supervision-*.test.cjs
          node --check functions/index.js
      - name: Reglas, integración y regresión de notificaciones sin IA real
        run: |
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec \
            --config firebase.rules-test.json --project security-rules-audit --only firestore,storage \
            "node --test --test-concurrency=1 tests/firebase-rules.test.mjs tests/project-supervision-integration.test.cjs tests/project-supervision-engine.test.cjs tests/project-supervision-ai.test.cjs tests/operational-notifications-tools.test.cjs tests/project-notification-activity.test.mjs"
      - name: Build de la web
        run: npm run build
