name: Diagnóstico aislado PR25 (sin release)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 00bd2d04af44aecc6d09fd0f440f7b78065c45dc
          persist-credentials: false
      - name: Verificar procedencia del artefacto original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/gonhercaral-cpu/desarrollo-proyectos/actions/runs/42867718596 --jq .head_sha)" = 00bd2d04af44aecc6d09fd0f440f7b78065c45dc
          test "$(gh api repos/gonhercaral-cpu/desarrollo-proyectos/actions/artifacts/13792232171 --jq .workflow_run.id)" = 42867718596
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: '13792232171'
          run-id: '42867718596'
          github-token: ${{ github.token }}
          path: unsigned-diagnostic
          merge-multiple: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Preparar el harness existente, sin editar fuentes
        working-directory: active-classroom-desktop
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-x11 ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          rustup toolchain install stable --profile minimal
          rustup default stable
          npm ci
          mkdir -p "$RUNNER_TEMP/video-report" "$RUNNER_TEMP/video-fixtures"
          ACTIVE_CLASSROOM_MEDIA_PERFORMANCE=1 ACTIVE_CLASSROOM_MEDIA_EXPORT="$RUNNER_TEMP/video-fixtures" npm run test:media:linux
          sha256sum "$RUNNER_TEMP/video-fixtures"/* > "$RUNNER_TEMP/video-report/fixture-hashes.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/video-report/source-commit.txt"
          git status --porcelain > "$RUNNER_TEMP/video-report/generated-files.txt"
      - name: Mismos paquetes, solo .deb/X11 en Ubuntu 24.04 y control 22.04
        working-directory: active-classroom-desktop
        run: |
          set -euo pipefail
          mapfile -t debs < <(find ../unsigned-diagnostic -type f -name '*.deb')
          mapfile -t images < <(find ../unsigned-diagnostic -type f -name '*.AppImage')
          test "${#debs[@]}" -eq 1
          test "${#images[@]}" -eq 1
          deb="$(realpath "${debs[0]}")"
          image="$(realpath "${images[0]}")"
          scripts="$(realpath tests)"
          report="$RUNNER_TEMP/video-report"
          fixtures="$RUNNER_TEMP/video-fixtures"
          sha256sum "$deb" "$image" > "$report/package-hashes.txt"
          failed=0
          for ubuntu in 24.04 22.04; do
            container="video-pr25-${ubuntu//./-}-$GITHUB_RUN_ID"
            tag="video-pr25:${ubuntu//./-}-$GITHUB_RUN_ID"
            docker create --name "$container" -v "$deb:/package/classroom.deb:ro" -v "$scripts:/tests:ro" ubuntu:"$ubuntu" bash -euc 'bash /tests/linux-package-install.sh /package/classroom.deb apt 1.0.22; dpkg -i /package/classroom.deb; apt-get install -y --no-install-recommends xvfb xauth x11-utils dbus-x11 weston procps'
            docker start --attach "$container" > "$report/install-$ubuntu.log" 2>&1
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
            docker commit "$container" "$tag" >/dev/null
            docker image inspect "$tag" > "$report/image-$ubuntu.json"
            docker run --rm --network none "$tag" bash -c 'dpkg-query -W; . /usr/lib/active-classroom/system-media.sh; classroom_system_media /usr/lib/active-classroom/codecs; printf "LD_LIBRARY_PATH=%s\nGST_PLUGIN_PATH_1_0=%s\n" "${LD_LIBRARY_PATH:-}" "${GST_PLUGIN_PATH_1_0:-}"' > "$report/versions-and-route-$ubuntu.txt" 2>&1
            if [[ "$ubuntu" == 24.04 ]]; then cases='baseline1 baseline2 baseline3 trace1 trace2 trace3'; else cases='baseline1 trace1'; fi
            for case_name in $cases; do
              options=()
              if [[ "$case_name" == trace* ]]; then
                options=(-e 'GST_DEBUG=2,webkit*:5,playbin*:5,playsink:5,basesink:4,qtdemux:5,queue:5,appsrc:5' -e GST_DEBUG_NO_COLOR=1 -e 'GST_DEBUG_FILE=/diagnostics/gst-%p.log')
              fi
              case_report="$report/$ubuntu-$case_name"
              mkdir -p "$case_report"
              test_container="video-case-${ubuntu//./-}-$case_name-$GITHUB_RUN_ID"
              date -u +%FT%TZ > "$case_report/started.txt"
              cat /proc/loadavg > "$case_report/host-load.txt"
              nproc >> "$case_report/host-load.txt"
              set +e
              docker run --name "$test_container" --network none "${options[@]}" -v "$case_report:/diagnostics" -v "$image:/package/classroom.AppImage:ro" -v "$scripts:/tests:ro" -v "$fixtures:/fixtures:ro" "$tag" bash /tests/linux-packaged-media.sh /package/classroom.AppImage deb x11 > "$case_report/stdout.log" 2> "$case_report/stderr.log" &
              run_pid=$!
              (
                for snapshot in 1 2 3 4 5 6; do
                  sleep 5
                  docker exec "$test_container" bash -c 'for process in /proc/[0-9]*; do command=$(tr "\000" " " < "$process/cmdline" 2>/dev/null); case "$command" in *WebKitWebProcess*|*WebKitNetworkProcess*|*/runtime/active-classroom*) echo "PROCESS $process $command"; cat "$process/maps" 2>/dev/null;; esac; done' > "$case_report/maps-$snapshot.txt" 2>&1 || break
                done
              ) &
              sampler_pid=$!
              wait "$run_pid"
              status=$?
              kill "$sampler_pid" 2>/dev/null || true
              wait "$sampler_pid" 2>/dev/null || true
              docker inspect "$test_container" > "$case_report/container.json"
              docker rm "$test_container" >/dev/null
              set -e
              printf '%s %s %s\n' "$ubuntu" "$case_name" "$status" >> "$report/results.tsv"
              if [[ "$status" -ne 0 ]]; then failed=1; fi
            done
            docker rm "$container" >/dev/null
            docker image rm "$tag" >/dev/null
          done
          git status --porcelain > "$report/final-generated-files.txt"
          exit "$failed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: pr25-video-investigation-${{ github.run_id }}
          path: ${{ runner.temp }}/video-report/
          if-no-files-found: warn
          retention-days: 5
