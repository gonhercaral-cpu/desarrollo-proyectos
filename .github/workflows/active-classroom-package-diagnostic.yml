name: Diagnóstico paquete Linux publicado
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run fallido con artefactos sin firmar (vacío para diagnosticar 1.0.12)
        required: false
        type: string
      ubuntu:
        description: Base del diagnóstico de artefactos (vacío para todas)
        required: false
        type: choice
        options: ['', '22.04', '24.04', '26.04']
      inspect_only:
        description: Solo inspeccionar scripts de AppRun, sin ejecutar la aplicación
        required: false
        type: boolean
        default: false
  push:
    branches: [codex/active-classroom-linux-packaging]
    paths:
      - .github/workflows/active-classroom-package-diagnostic.yml
      - active-classroom-desktop/tests/linux-package-audit.sh
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: ${{ !inputs.source_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
        installer: [apt, gdebi]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Bytes exactos de 1.0.12 y sistema limpio
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/current.deb" https://github.com/gonhercaral-cpu/desarrollo-proyectos/releases/download/active-classroom-v1.0.12/Active.Classroom_1.0.12_amd64.deb
          echo 'fb11b42dfddaedaf2f4b49902bf23da5f2d9b89edd14fd64e95a399d3a881572  current.deb' > "$RUNNER_TEMP/current.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check current.sha256)
          docker run --rm -v "$RUNNER_TEMP/current.deb:/package/current.deb:ro" -v "$GITHUB_WORKSPACE/active-classroom-desktop/tests/linux-package-audit.sh:/audit.sh:ro" ubuntu:${{ matrix.ubuntu }} bash /audit.sh /package/current.deb '${{ matrix.installer }}'
  packaging:
    if: ${{ inputs.source_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: classroom-packaging-diagnostic-*
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: unsigned-diagnostic
          merge-multiple: true
      - name: Instalar herramientas del harness
        if: ${{ !inputs.inspect_only }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gstreamer1.0-tools
      - name: Inspeccionar AppRun y hooks del artefacto real
        run: |
          set -euo pipefail
          image="$(find unsigned-diagnostic -type f -name '*.AppImage' -print -quit)"
          image="$(realpath "$image")"
          chmod 755 "$image"
          directory="$(mktemp -d)"
          (cd "$directory" && "$image" --appimage-extract >/dev/null)
          cat "$directory/squashfs-root/AppRun"
          for name in linuxdeploy-plugin-gtk zz-active-classroom-system-glib zz-active-classroom-wayland; do
            cat "$directory/squashfs-root/apprun-hooks/$name.sh"
          done
      - name: Validar los mismos bytes sin recompilar ni firmar
        if: ${{ !inputs.inspect_only }}
        working-directory: active-classroom-desktop
        env:
          CLASSROOM_PACKAGE_OS: ${{ inputs.ubuntu }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/{deb,appimage}
          mapfile -t debs < <(find ../unsigned-diagnostic -type f -name '*.deb')
          mapfile -t images < <(find ../unsigned-diagnostic -type f -name '*.AppImage')
          test "${#debs[@]}" -eq 1
          test "${#images[@]}" -eq 1
          cp "${debs[0]}" src-tauri/target/release/bundle/deb/
          cp "${images[0]}" src-tauri/target/release/bundle/appimage/
          chmod 755 src-tauri/target/release/bundle/appimage/*.AppImage
          version="$(node -p 'require("./package.json").version')"
          bash tests/validate-linux-packages.sh "$version" "$RUNNER_TEMP/package-validation"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: packaging-recheck-${{ github.run_id }}
          path: ${{ runner.temp }}/package-validation/*
          if-no-files-found: warn
          retention-days: 3
