name: Classroom runtime comparison (diagnostic only)

on:
  workflow_dispatch:
    inputs:
      validation_run:
        required: false
        type: string
      commit:
        required: false
        type: string
      media_probe:
        required: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Ubuntu 24 AppImage Wayland runtime ${{ matrix.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        version: ['1.0.23', '1.0.24']
    defaults:
      run:
        shell: bash
        working-directory: active-classroom-desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: active-classroom-desktop/package-lock.json
      - name: Dependencias del adaptador de pruebas
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libsecret-tools gnome-keyring dbus-x11 xvfb xauth weston ffmpeg gstreamer1.0-tools gstreamer1.0-gl gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          rustup toolchain install stable --profile minimal
          rustup default stable
          npm ci
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            active-classroom-desktop/src-tauri/target
          key: classroom-native-ubuntu22-x64-${{ hashFiles('active-classroom-desktop/src-tauri/Cargo.lock') }}
          restore-keys: classroom-native-ubuntu22-x64-
      - name: Preparar fixtures con el mismo reproductor
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          ACTIVE_CLASSROOM_MEDIA_PERFORMANCE=1 ACTIVE_CLASSROOM_MEDIA_EXPORT="$RUNNER_TEMP/fixtures" npm run test:media:linux
      - name: Esperar artefacto del intento actual y descargarlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 170); do
            artifact=$(gh api repos/gonhercaral-cpu/desarrollo-proyectos/actions/runs/44150284122/artifacts --jq '.artifacts[]|select(.expired==false)|select((.name|startswith("classroom-packaging-diagnostic-")) or ((.name|startswith("active-classroom-validation-")) and ((.name|contains("reports"))|not)))|.name' | head -1)
            if [[ -n "$artifact" ]]; then
              gh run download 44150284122 --name "$artifact" --dir "$RUNNER_TEMP/candidate"
              exit 0
            fi
            sleep 30
          done
          echo "El intento actual no dejó paquetes disponibles para comparar" >&2
          exit 1
      - name: Preparar exactamente los dos runtimes
        env:
          PROBE_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/report" "$RUNNER_TEMP/probe"
          deb=$(find "$RUNNER_TEMP/candidate" -name '*.deb' -type f -print -quit)
          image=$(find "$RUNNER_TEMP/candidate" -name '*.AppImage' -type f -print -quit)
          test -f "$deb" && test -f "$image"
          cp "$deb" "$RUNNER_TEMP/probe/classroom.deb"
          if [[ "$PROBE_VERSION" == 1.0.23 ]]; then
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/probe/classroom.AppImage" https://github.com/gonhercaral-cpu/desarrollo-proyectos/releases/download/active-classroom-v1.0.23/Active-Classroom-1.0.23-x86_64.AppImage
            echo "edfa00ee6da593d24d9f74ff62bb717a5a78cb600d6c065e97c1cd587aa111c3  $RUNNER_TEMP/probe/classroom.AppImage" | sha256sum --check
          else
            cp "$image" "$RUNNER_TEMP/probe/classroom.AppImage"
          fi
          chmod 755 "$RUNNER_TEMP/probe/classroom.AppImage"
          sha256sum "$RUNNER_TEMP/probe/"* > "$RUNNER_TEMP/report/input-sha256.txt"
      - name: Cinco procesos independientes, límites originales intactos
        env:
          PROBE_VERSION: ${{ matrix.version }}
        run: |
          tag="classroom-runtime-probe:${GITHUB_RUN_ID}"
          name="classroom-runtime-probe-${GITHUB_RUN_ID}"
          scripts=$(realpath tests)
          docker create --name "$name" -v "$RUNNER_TEMP/probe/classroom.deb:/package/classroom.deb:ro" -v "$scripts:/tests:ro" ubuntu:24.04 bash -euc 'bash /tests/linux-package-install.sh /package/classroom.deb apt 1.0.24; dpkg -i /package/classroom.deb; apt-get install -y --no-install-recommends xvfb xauth x11-utils dbus-x11 weston procps'
          docker start --attach "$name" > "$RUNNER_TEMP/report/install.log" 2>&1
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
          docker commit "$name" "$tag" >/dev/null
          docker rm "$name" >/dev/null
          failures=0
          for attempt in 1 2 3 4 5; do
            status=0
            docker run --rm --network none -v "$RUNNER_TEMP/probe/classroom.AppImage:/package/classroom.AppImage:ro" -v "$scripts:/tests:ro" -v "$RUNNER_TEMP/fixtures:/fixtures:ro" "$tag" bash /tests/linux-packaged-media.sh /package/classroom.AppImage appimage wayland > "$RUNNER_TEMP/report/native-$attempt.log" 2>&1 || status=$?
            sed -E -i 's#http://127\.0\.0\.1:[0-9]+/media/[a-f0-9]{64}#LOCAL_MEDIA#g' "$RUNNER_TEMP/report/native-$attempt.log"
            echo "RUNTIME_COMPARISON version=$PROBE_VERSION attempt=$attempt exit=$status" | tee -a "$RUNNER_TEMP/report/results.txt"
            if (( status )); then failures=$((failures + 1)); fi
          done
          test "$failures" -eq 0
      - name: Conservar resultados sin firma ni publicación
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: classroom-runtime-comparison-${{ matrix.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/report/
          retention-days: 7
          if-no-files-found: warn
