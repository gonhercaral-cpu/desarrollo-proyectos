name: Active Classroom Desktop Linux

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "active-classroom-v*"
    paths:
      - "active-classroom-desktop/**"
      - "docs/active-classroom-manifest.example.json"
      - ".github/workflows/active-classroom-linux.yml"
      - "drive/activeClassroom*.js"
      - "drive/activeClassroomPublicationLimits.json"
      - "drive/index.js"
      - "functions/deviceAccess.js"
      - "functions/index.js"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.rules-test.json"
      - "tests/active-classroom-device*"
      - "src/active-classroom/**"
      - "active-classroom-processor/**"
      - "tests/active-classroom-office*"
      - "tests/active-classroom-slides*"
      - "docs/active-classroom-manifest.office.example.json"

permissions:
  contents: read

concurrency:
  group: active-classroom-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permissions:
    name: Autorización de equipos y reglas Firebase
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI: "true"
      XDG_CONFIG_HOME: ${{ github.workspace }}/.firebase/cli-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            drive/package-lock.json
            active-classroom-desktop/package-lock.json
      - name: Instalar dependencias bloqueadas y CLI de emuladores
        run: |
          npm ci
          npm ci --prefix drive
          npm ci --prefix active-classroom-desktop
          npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@15.27.0
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Tests backend y lint específico
        run: |
          mapfile -t classroom_tests < <(find tests -maxdepth 1 -type f -name 'active-classroom-*.test.*' ! -name '*-emulator.test.*' | sort)
          node --test "${classroom_tests[@]}"
          npx eslint drive/activeClassroomProcessing*.js drive/activeClassroomProcessorClient.js drive/activeClassroomUnit.js tests/active-classroom-office*.cjs
          npx eslint drive/activeClassroomSlides.js drive/activeClassroomDriveContent.js tests/active-classroom-slides*.cjs
          npx eslint src/active-classroom/components/UnitEditor.jsx src/active-classroom/services/unitEditorService.js src/active-classroom/utils/unitDraft.js
          npx eslint drive/activeClassroomDevices.js drive/activeClassroomDesktop.js functions/deviceAccess.js tests/active-classroom-device*.cjs
          npx eslint src/active-classroom/components/TeamsPanel.jsx src/active-classroom/services/deviceService.js tests/active-classroom-device-ui.test.mjs
          npm run build
          node --check drive/index.js
          node --check functions/index.js
      - name: Reglas y transacciones reales en emuladores
        run: |
          publication_tests=""
          if [[ -f tests/active-classroom-large-publication-emulator.test.cjs ]]; then
            publication_tests=" tests/active-classroom-large-publication-emulator.test.cjs"
          fi
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec \
            --config firebase.rules-test.json --project security-rules-audit --only auth,firestore,storage \
            "node --test --test-concurrency=1 tests/firebase-rules.test.mjs tests/active-classroom-drive-emulator.test.cjs tests/active-classroom-unit-emulator.test.cjs tests/active-classroom-device-emulator.test.cjs active-classroom-desktop/tests/device-auth-emulator.test.mjs tests/active-classroom-office-emulator.test.cjs tests/active-classroom-slides-emulator.test.cjs${publication_tests}"
  office:
    name: Conversión Office real en contenedor
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build del mismo contenedor usado por Cloud Run
        run: docker build --tag active-classroom-office:test active-classroom-processor
      - name: PPT/PPTX/DOC/DOCX a PDF, páginas, integridad y fallos reales
        run: docker run --rm --network none --memory 2g --cpus 2 --entrypoint python active-classroom-office:test -m unittest discover -s tests -v
  linux:
    name: Tests, Cargo y paquete Debian
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: active-classroom-desktop
    env:
      CI: "true"
      CARGO_TERM_COLOR: never
      RUST_TOOLCHAIN: stable

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: active-classroom-desktop/package-lock.json

      - name: Dependencias nativas Tauri 2 / WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libsecret-tools gnome-keyring dbus-x11 \
            policykit-1 sudo \
            python3-gi gir1.2-webkit2-4.1 xvfb xauth weston ffmpeg \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: Rust estable mediante rustup
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
          rustup show active-toolchain
          node --version
          npm --version
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1

      - name: Instalar dependencias del lockfile
        run: npm ci

      - name: Restaurar compilación nativa sin claves de firma
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            active-classroom-desktop/src-tauri/target
          key: classroom-native-ubuntu22-x64-${{ hashFiles('active-classroom-desktop/src-tauri/Cargo.lock') }}
          restore-keys: classroom-native-ubuntu22-x64-

      - name: Tests offline
        run: npm run test:offline

      - name: Tests de identidad y activación
        run: npm run test:device

      - name: Transporte de publicaciones en WebKitGTK real
        run: npm run test:webkit

      - name: Tests Player
        run: npm run test:player

      - name: Tests del updater del programa
        run: npm run test:updater

      - name: Tests de sesión y proyector offline
        run: npm run test:projection

      - name: Tests existentes del prototipo conservado
        run: |
          npm run admin:test
          npm run local:integration:test

      - name: Lint específico
        run: npm run lint:player

      - name: Build TypeScript/Vite y tests de empaquetado PDF.js
        # npm run build incluye test:bundle: worker, fuentes, CMaps, ICC y WASM.
        run: |
          npm run build
          npm run test:release
          test -s dist/index.html
          test -s dist/active-classroom-icon.png

      - name: Versión única de la distribución
        id: release
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"

      - name: Cinco tests Rust de caché offline
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib offline_cache::tests:: -- --list \
            | tee "$RUNNER_TEMP/active-classroom-rust-tests.txt"
          test "$(grep -c '^offline_cache::tests::.*: test$' "$RUNNER_TEMP/active-classroom-rust-tests.txt")" -eq 5
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib offline_cache::tests:: -- --nocapture

      - name: Todos los tests Rust (identidad, caché, proyección y legado)
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets -- --nocapture

      - name: Persistencia real en llavero Linux aislado
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export ACTIVE_CLASSROOM_TEST_KEYRING=1
          dbus-run-session -- bash -euo pipefail -c '
            openssl rand -hex 32 | gnome-keyring-daemon --unlock --components=secrets
            openssl rand -hex 32 | secret-tool store --label CI-fixture application com.activeclassroom.desktop credential device-v1
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib device_identity::tests::linux_keyring_round_trip -- --ignored --nocapture
          '

      - name: Cargo check y validación nativa de configuración/capabilities
        # build.rs ejecuta tauri_build::build(); no se usa un mock de Tauri.
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: MP4 H.264/AAC local, Range, controles, proyección y scroll largo en Tauri real
        run: npm run test:media:linux

      - name: Fullscreen Tauri real en Wayland con dos monitores virtuales
        run: bash tests/wayland-projection.sh

      # Save BEFORE acceptance fixtures and production signing. No production
      # private key has been exposed to any process cached by this step.
      - name: Guardar compilación nativa antes de usar claves de firma
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            active-classroom-desktop/src-tauri/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Updater .deb real 1.0.4 a 1.0.5, firmas, reinicio y persistencia
        env:
          ACTIVE_CLASSROOM_UPDATER_CI_REPORT: ${{ runner.temp }}/updater-acceptance.json
        run: bash tests/updater-linux.sh

      - name: Build Tauri Linux .deb
        env:
          ACTIVE_CLASSROOM_UPDATER_PUBLIC_KEY: ${{ vars.ACTIVE_CLASSROOM_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/active-classroom-v* ]]; then
            test "$GITHUB_REF_NAME" = "active-classroom-v${{ steps.release.outputs.version }}"
          fi
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          node scripts/updater-release.mjs config "$RUNNER_TEMP/updater-release.json"
          npm run tauri:build -- --config "$RUNNER_TEMP/updater-release.json" --bundles deb -- --locked
          node scripts/updater-release.mjs metadata "$RUNNER_TEMP/updater-assets"
          # Verify the signed bytes with the embedded public key before publication.
          node scripts/verify-updater-signature.mjs

      - name: Comprobar paquete y lockfiles
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb --field "${packages[0]}" Architecture)" = amd64
          test "$(dpkg-deb --field "${packages[0]}" Version)" = '${{ steps.release.outputs.version }}'
          test "$(basename "${packages[0]}")" = 'Active Classroom_${{ steps.release.outputs.version }}_amd64.deb'
          dpkg-deb --info "${packages[0]}"
          file src-tauri/target/release/active-classroom
          if grep -a -q 'ACTIVE_CLASSROOM_UPDATER_STAGE' src-tauri/target/release/active-classroom; then
            echo 'El instalador de producción incluye hooks de aceptación; release bloqueada.' >&2
            exit 1
          fi
          (
            cd "$(dirname "${packages[0]}")"
            package_name="$(basename "${packages[0]}")"
            sha256sum "$package_name" > "$package_name.sha256"
            sha256sum --check "$package_name.sha256"
          )
          {
            printf '### Active Classroom Desktop Linux\n\n'
            printf 'Paquete: `%s`\n\n' "${packages[0]}"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Versión: `%s`\n\n' '${{ steps.release.outputs.version }}'
            printf 'SHA-256: `%s`\n\n' "$(cut -d ' ' -f 1 "${packages[0]}.sha256")"
            printf 'Runner: Ubuntu 22.04 x64\n\n'
            printf 'Rust: `%s`\n\n' "$(rustc --version)"
            printf 'Cargo: `%s`\n\n' "$(cargo --version)"
            printf 'Node: `%s`; npm: `%s`\n\n' "$(node --version)" "$(npm --version)"
            printf 'Build y tests nativos completos. Reproducción, codecs y Firebase requieren aceptación en el equipo Linux destino.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir instalador Debian y SHA-256
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: active-classroom-${{ steps.release.outputs.version }}-linux-amd64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/updater-assets/*
            ${{ runner.temp }}/updater-acceptance.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publicar release estable verificado
    if: startsWith(github.ref, 'refs/tags/active-classroom-v')
    needs: [permissions, office, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: active-classroom-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: active-classroom-*-linux-amd64-${{ github.sha }}
          path: release-assets
      - name: Subir a draft y publicar solo después de completar todos los assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find release-assets -type f -name '*.deb')
          mapfile -t manifests < <(find release-assets -type f -name latest.json)
          mapfile -t notes < <(find release-assets -type f -name release-notes.md)
          test "${#installers[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          test "${#notes[@]}" -eq 1
          version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).version' "${manifests[0]}")"
          test "$GITHUB_REF_NAME" = "active-classroom-v$version"
          latest_tag="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$latest_tag" == active-classroom-v* ]]; then
            node -e 'const [old,next]=process.argv.slice(1).map(v=>v.replace(/^active-classroom-v/, "").split(".").map(Number)); const index=next.findIndex((v,i)=>v!==old[i]); if(index<0 || next[index]<old[index]) process.exit(1)' "$latest_tag" "$GITHUB_REF_NAME"
          fi
          test -s "${installers[0]}.sig"
          (cd "$(dirname "${installers[0]}")" && sha256sum --check "$(basename "${installers[0]}").sha256")
          # Never overwrite an already published installer or race stable versions.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > existing-release.txt 2>/dev/null; then
            test "$(cat existing-release.txt)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Active Classroom $version" --notes-file "${notes[0]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "${installers[0]}" "${installers[0]}.sig" "${installers[0]}.sha256" "${manifests[0]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "${notes[0]}"
