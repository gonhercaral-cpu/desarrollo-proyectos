[package]
name = "active-classroom"
version = "1.0.4"
description = "Panel docente y vista de alumnado para un salón de clases activo"
authors = ["Active Classroom"]
edition = "2021"

[lib]
name = "active_classroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Isolated CI acceptance only; never enabled for production release.
updater-acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
getrandom = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.13.1"
regex = "1"
zip = "2.4"
